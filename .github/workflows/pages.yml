# The project page — the API reference, generated from the release tag.
#
# The site is an artifact of one commit: the tag named by `package.json`'s
# version. The job resolves that tag, checks it out, runs the pipeline the
# repository documents (`npm run build`, `npm run types`, `npm run docs`) and
# deploys `site/`. A push to main without a matching tag builds nothing, so the
# page and the published package cannot skew.
#
# Why main, not the tag: the `github-pages` environment admits deployments from
# the branches `main`, `pages` and `gh-pages` only — a tag push has no branch
# for that policy to admit. The deployment therefore runs on `main` while the
# tree it publishes is the tag's.
#
# Pages serves the artifact at https://objetos.github.io/p5.quadrille.js/. The
# generated pages use relative URLs only, so no base URL needs injecting.
name: Release — API site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        name: Resolve the release tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "No $tag in this clone — a main push without a release tag publishes nothing."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  site:
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run types
      - run: npm run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [resolve, site]
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  note:
    needs: [resolve, site]
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Open the release note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag
