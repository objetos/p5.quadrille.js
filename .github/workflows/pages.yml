# The project page — the API reference, generated from the tagged commit.
#
# One trigger: a release tag. The site is an artifact of that commit — the same
# commit npm publishes — so the page and the package can never skew. The build
# runs the pipeline the repository documents (`npm run build`, `npm run types`,
# `npm run docs`) and deploys `site/`; nothing is rebuilt later from a branch.
#
# Pages serves the artifact at https://objetos.github.io/p5.quadrille.js/. The
# generated pages use relative URLs only, so no base URL needs injecting.
name: Release — API site

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run types
      - run: npm run docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write the release note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
